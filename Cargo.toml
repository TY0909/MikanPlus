[package]
name = "mikan_plus"
version = "0.1.0"
edition = "2024"

# 二进制名(PascalCase):macOS 菜单栏/Dock 显示的应用名
[[bin]]
name = "MikanPlus"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
filetime = "0.2"
gpui = "0.2.2"
gpui-component = "0.5.1"
librqbit = { version = "9.0.1", default-features = false, features = ["http-api-client", "rust-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
ureq = { version = "2", features = ["charset", "json"] }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
taffy = "0.9"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
