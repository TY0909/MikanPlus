[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/domain",
    "crates/downloader",
    "crates/source",
    "crates/storage",
    "crates/ui",
]
default-members = ["crates/app"]

[workspace.package]
version = "0.2.2"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.88"

[workspace.dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
filetime = "0.2"
gpui-kit = { version = "0.6", default-features = false, features = ["assets", "component"] }
librqbit = { version = "9.0.1", default-features = false, features = ["http-api-client", "rust-tls"] }
scraper = "0.20"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
taffy = "0.9"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", features = ["charset", "json"] }
winres = "0.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
